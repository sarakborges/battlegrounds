name: Apply effect schema validator ownership cleanup

on:
  push:
    branches:
      - validator-effect-schema-ownership
    paths:
      - .github/workflows/apply-effect-schema-validator-cleanup.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validator-effect-schema-ownership
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply ownership cleanup
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/apply_effect_schema_cleanup.py
          python3 /tmp/apply_effect_schema_cleanup.py
      - name: Test content validation
        run: dotnet test tests/Battlegrounds.Content.Tests/Battlegrounds.Content.Tests.csproj --configuration Release
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/apply-effect-schema-validator-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Battlegrounds.Content/DirectoryModValidator.cs \
                  src/Battlegrounds.Content/PowerLifecycleModValidator.cs \
                  src/Battlegrounds.Content/ModValidator.cs \
                  tests/Battlegrounds.Content.Tests/EffectSchemaOwnershipValidationTests.cs \
                  .github/workflows/apply-effect-schema-validator-cleanup.yml
          git commit -m "Remove effect schema validator suppression"
          git push origin HEAD:validator-effect-schema-ownership
