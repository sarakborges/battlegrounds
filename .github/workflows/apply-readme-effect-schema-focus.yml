name: Apply README effect schema focus

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update README focus
        run: |
          echo '' | base64 --decode > /tmp/update_readme.py
          python3 /tmp/update_readme.py
      - name: Commit docs update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-readme-effect-schema-focus.yml
          git add README.md
          git commit -m "Advance validator cleanup focus"
          git push origin HEAD:main
