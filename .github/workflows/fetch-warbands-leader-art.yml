name: Fetch Warbands leader art

on:
  push:
    paths:
      - scripts/fetch-warbands-leader-art.py
      - .github/workflows/fetch-warbands-leader-art.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Fetch Hearthstone leader art
        run: python scripts/fetch-warbands-leader-art.py

      - name: Commit imported art
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/warbands/assets/cosmetics/leaders
          if git diff --cached --quiet; then
            echo "No leader art changes to commit."
            exit 0
          fi
          git commit -m "Import Hearthstone leader base art"
          git pull --rebase origin main
          git push origin HEAD:main
