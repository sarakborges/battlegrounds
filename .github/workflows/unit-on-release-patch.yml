name: unit-on-release-patch
on:
  push:
    branches: [unit-on-release-trigger]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unit-on-release-trigger
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply slice
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/Battlegrounds.Core/Domain/Effects/NativeEffectKeys.cs',
              '    public static NativeTriggerKey OnAcquire { get; } = new("onAcquire");\n    public static NativeTriggerKey OnPlay { get; } = new("onPlay");',
              '    public static NativeTriggerKey OnAcquire { get; } = new("onAcquire");\n    public static NativeTriggerKey OnRelease { get; } = new("onRelease");\n    public static NativeTriggerKey OnPlay { get; } = new("onPlay");')
          replace(
              'src/Battlegrounds.Core/Domain/Effects/NativeEffectKeys.cs',
              '        OnActivate, OnMatchStart, OnAcquire, OnPlay, OnCombine, OnDeath, AfterFriendlyDeaths, AfterEventCount, OnSummon, OnAttack, OnDamage,',
              '        OnActivate, OnMatchStart, OnAcquire, OnRelease, OnPlay, OnCombine, OnDeath, AfterFriendlyDeaths, AfterEventCount, OnSummon, OnAttack, OnDamage,')

          replace(
              'src/Battlegrounds.Core/Domain/Preparation/PreparationEffectEngine.cs',
              '    public void ProcessPlayedUnit(\n',
              '''    public void ProcessReleasedUnit(MatchState match, PlayerState owner, UnitInstance unit)\n    {\n        var (world, runtime) = GetRuntime(match);\n        var subject = world.Wrap(unit, owner.Id);\n        runtime.RecordGameEvent(owner.Id, NativeGameEventKeys.UnitReleased, unit.Definition);\n        runtime.Process(new GameEffectEvent(NativeTriggerKeys.OnRelease, subject));\n    }\n\n    public void ProcessPlayedUnit(\n''')

          replace(
              'src/Battlegrounds.Core/Domain/Preparation/PreparationEngine.cs',
              '''        var unit = player.Field[command.FieldSlot];\n        if (unit.PoolReturnDefinition is not null) _unitPool.ReturnUnit(unit.PoolReturnDefinition);\n        player.RemoveFromField(command.FieldSlot);\n        player.GainResource(_rules.ReleaseValue, _rules.MaximumResource);\n        _effectEngine.ProcessGameEvent(match, player, NativeGameEventKeys.UnitReleased, unit.Definition);\n''',
              '''        var unit = player.Field[command.FieldSlot];\n        player.RemoveFromField(command.FieldSlot);\n        if (unit.ReleasePoolReturnDefinition() is UnitDefinition poolDefinition) _unitPool.ReturnUnit(poolDefinition);\n        player.GainResource(_rules.ReleaseValue, _rules.MaximumResource);\n        _effectEngine.ProcessReleasedUnit(match, player, unit);\n''')

          replace(
              'mods/warbands/content/units/scrapbot.json',
              '  "triggers": []',
              '''  "triggers": [\n    {\n      "event": "onRelease",\n      "effects": [\n        { "kind": "addResource", "amount": 1 }\n      ]\n    }\n  ]''')

          test_path = Path('tests/Battlegrounds.Core.Tests/Preparation/PreparationEffectExecutionTests.cs')
          test_text = test_path.read_text()
          marker = '    private static void AcquireById(\n'
          if marker not in test_text:
              raise SystemExit('test insertion marker missing')
          test = '''    [Fact]\n    public void Release_OnReleaseRunsAfterSourceLeavesFieldAndBaseRewardIsApplied()\n    {\n        var released = new UnitDefinition(\n            new UnitId("released"),\n            "Released",\n            1,\n            2,\n            2,\n            triggers:\n            [\n                new TriggerDefinition(\n                    NativeTriggerKeys.OnRelease,\n                    [\n                        new ModifyStatsEffectDefinition(new EffectTargetSelector(EffectTargetScope.Friendly), 1, 2),\n                        new AddResourceEffectDefinition(new SourceStatEffectValueExpression(EffectStat.Attack)),\n                    ]),\n            ]);\n        var ally = new UnitDefinition(new UnitId("ally"), "Ally", 1, 1, 1);\n\n        var setup = CreateStartedMatch([released, ally], [released, ally], startingResource: 0, acquireCost: 0);\n        var player = setup.Match.Players[0];\n        AcquireById(setup.Engine, setup.Match, player.Id, released.Id);\n        Assert.True(setup.Engine.Execute(setup.Match, new DeployUnitCommand(player.Id, 0)).Succeeded);\n        AcquireById(setup.Engine, setup.Match, player.Id, ally.Id);\n        Assert.True(setup.Engine.Execute(setup.Match, new DeployUnitCommand(player.Id, 0)).Succeeded);\n\n        var releasedUnit = player.Field.Single(unit => unit.Definition.Id == released.Id);\n        var releasedIndex = Enumerable.Range(0, player.Field.Count).Single(index => player.Field[index].Id == releasedUnit.Id);\n        Assert.True(setup.Engine.Execute(setup.Match, new ReleaseUnitCommand(player.Id, releasedIndex)).Succeeded);\n\n        var remaining = Assert.Single(player.Field);\n        Assert.Equal(ally.Id, remaining.Definition.Id);\n        Assert.Equal(2, remaining.Attack);\n        Assert.Equal(3, remaining.Health);\n        Assert.Equal(2, releasedUnit.Attack);\n        Assert.Equal(2, releasedUnit.Health);\n        Assert.Equal(3, player.Resource);\n        Assert.Equal(1, setup.Pool.GetAvailableCopies(released.Id));\n    }\n\n'''
          test_path.write_text(test_text.replace(marker, test + marker, 1))
      - name: Test core
        run: dotnet test tests/Battlegrounds.Core.Tests/Battlegrounds.Core.Tests.csproj --configuration Release
      - name: Test content
        run: dotnet test tests/Battlegrounds.Content.Tests/Battlegrounds.Content.Tests.csproj --configuration Release
      - name: Smoke Warbands
        run: dotnet run --project tools/Battlegrounds.Simulator/Battlegrounds.Simulator.csproj --configuration Release -- --mod mods/warbands --matches 4 --players 4 --seed 23
      - name: Commit implementation
        run: |
          rm .github/workflows/unit-on-release-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Unit onRelease trigger" || exit 0
          git push origin HEAD:unit-on-release-trigger
