name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check web UI Atomic Design structure
        run: |
          set -euo pipefail

          webui=src/Battlegrounds.Game/webui

          for legacy in design-system components screens; do
            test ! -e "$webui/$legacy"
          done

          for layer in atoms molecules organisms templates; do
            for dir in "$webui/$layer"/*; do
              name="$(basename "$dir")"
              test -f "$dir/$name.html"
              test -f "$dir/$name.css"
              test -f "$dir/$name.js"
            done
          done

          if grep -R --include='*.js' -nE 'innerHTML|insertAdjacentHTML|`[[:space:]]*<'             "$webui/atoms"             "$webui/molecules"             "$webui/organisms"             "$webui/templates"             "$webui/pages"; then
            echo 'HTML markup must live in .html template files, not JavaScript.' >&2
            exit 1
          fi

          if grep -R --include='*.js' -nE '../../(molecules|organisms|templates|pages)/' "$webui/atoms"; then
            echo 'Atoms must not import higher Atomic Design layers.' >&2
            exit 1
          fi
          if grep -R --include='*.js' -nE '../../(organisms|templates|pages)/' "$webui/molecules"; then
            echo 'Molecules must not import organisms, templates, or pages.' >&2
            exit 1
          fi
          if grep -R --include='*.js' -nE '../../(templates|pages)/' "$webui/organisms"; then
            echo 'Organisms must not import templates or pages.' >&2
            exit 1
          fi
          if grep -R --include='*.js' -nE '../../pages/' "$webui/templates"; then
            echo 'Templates must not import pages.' >&2
            exit 1
          fi

          if grep -R --include='*.css' -nE '\.(card|action-button|horizontal-stack|player-chip|character-portrait)([^a-zA-Z0-9_-]|$)' "$webui/templates/preparation"; then
            echo 'Preparation template CSS must not style reusable component internals.' >&2
            exit 1
          fi

          if grep -R --include='*.css' -nE '@media|[0-9.]+(vw|vh)'             "$webui/atoms"             "$webui/molecules"             "$webui/organisms"             "$webui/templates"; then
            echo 'Atomic UI layers must use the shared logical viewport scale instead of media queries or vw/vh geometry.' >&2
            exit 1
          fi

          if grep -R --include='*.css' -n '!important' "$webui"; then
            echo 'CSS must rely on ownership, load order, and selector specificity instead of !important.' >&2
            exit 1
          fi
      - name: Check web UI JavaScript syntax
        run: find src/Battlegrounds.Game/webui -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test core
        run: dotnet test tests/Battlegrounds.Core.Tests/Battlegrounds.Core.Tests.csproj --configuration Release
      - name: Test mod content boundary
        run: dotnet test tests/Battlegrounds.Content.Tests/Battlegrounds.Content.Tests.csproj --configuration Release
      - name: Test AI command policy
        run: dotnet test tests/Battlegrounds.AI.Tests/Battlegrounds.AI.Tests.csproj --configuration Release
      - name: Test application session orchestration
        run: dotnet test tests/Battlegrounds.Application.Tests/Battlegrounds.Application.Tests.csproj --configuration Release
      - name: Smoke-test headless simulator
        run: dotnet run --project tools/Battlegrounds.Simulator/Battlegrounds.Simulator.csproj --configuration Release -- --mod mods/example --matches 2 --players 2 --seed 17
      - name: Smoke-test Warbands playable mod
        run: dotnet run --project tools/Battlegrounds.Simulator/Battlegrounds.Simulator.csproj --configuration Release -- --mod mods/warbands --matches 4 --players 4 --seed 23
      - name: Build Godot presentation adapter
        run: dotnet build src/Battlegrounds.Game/Battlegrounds.Game.csproj --configuration Release
