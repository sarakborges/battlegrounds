name: Fetch Warbands card art

on:
  push:
    paths:
      - scripts/fetch-warbands-card-art.py
      - .github/workflows/fetch-warbands-card-art.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Hearthstone card art
        run: python scripts/fetch-warbands-card-art.py

      - name: Commit imported art and manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/warbands/assets/units mods/warbands/assets/actions mods/warbands/assets/presentation.json mods/warbands/assets/art-sources.json
          if git diff --cached --quiet; then
            echo "No card art changes to commit."
            exit 0
          fi
          git commit -m "feat(warbands): import Hearthstone card art"
          git pull --rebase origin main
          git push origin HEAD:main
