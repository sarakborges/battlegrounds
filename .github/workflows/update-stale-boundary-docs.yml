name: Update stale application boundary docs

on:
  push:
    branches: [combat-summon-tier-settlement]
    paths: [.github/workflows/update-stale-boundary-docs.yml]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update current boundaries
        shell: python
        run: |
          from pathlib import Path

          game = Path("GAME.md")
          text = game.read_text()
          text = text.replace(
              "- `ParticipantCount`: one human plus AI opponents. It must satisfy the selected mod's player-count rules and is currently required to be even because round one has no eliminated-opponent snapshot;",
              "- `ParticipantCount`: one human plus AI opponents. It may be odd or even and must satisfy the selected mod's player-count rules; an odd first combat round uses an explicit bye until an eliminated-opponent snapshot exists;"
          )
          old = """## Next presentation boundary

The development scene still receives one exported `ModPath`, so a real user cannot inspect/select mods without changing editor configuration. The next boundary should introduce deterministic mod discovery and a Godot selection surface over lightweight Content-owned package summaries/validation diagnostics. Invalid packages should remain inspectable but must never become running sessions, and Application/Core must remain unaware of discovery directories or selection UI.
"""
          new = """## Mod selection boundary

The project starts from `ModLauncher`, which asks `Battlegrounds.Content` for deterministic package discovery and lightweight validation summaries before a gameplay session exists. Valid packages may be selected and launched; invalid packages remain inspectable through diagnostics but never become running sessions.

Discovery directories, package inspection and selection UI remain presentation/content concerns. `Battlegrounds.Application` and `Battlegrounds.Core` only receive an already validated selected package and stay unaware of launcher filesystem policy.
"""
          if old not in text:
              raise SystemExit("GAME.md presentation boundary block not found")
          game.write_text(text.replace(old, new))

          app = Path("APPLICATION.md")
          text = app.read_text()
          old = """## Current odd-player constraint

The current Core combat contract requires an eliminated-opponent snapshot when the active player count is odd. No such snapshot exists before the first combat round, so a session currently requires an even initial participant count.

This is an explicit application precondition, not a hidden bye rule. A future matchmaking design may change that contract, but the session must continue to produce explicit pairings rather than bypass `MatchEngine` validation.
"""
          new = """## Odd-player pairing boundary

Sessions may start with odd or even participant counts as long as the selected mod's player-count rules allow them. Pairing remains explicit: when an odd active-player count has no eliminated-opponent snapshot yet, the pairing policy assigns one explicit bye. A bye is recorded in authoritative pairing history, creates no combat settlement, deals no damage and fires no combat lifecycle effects.

Once an eliminated-opponent snapshot exists, the odd player may instead be paired against that immutable archived participant. `SinglePlayerSession` still delegates pairing policy and submits the resulting explicit `CombatPairing` values to `MatchEngine`; it never bypasses Core pairing validation.
"""
          if old not in text:
              raise SystemExit("APPLICATION.md odd-player block not found")
          app.write_text(text.replace(old, new))
      - name: Commit docs directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GAME.md APPLICATION.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh application boundary docs"
          git push origin HEAD:main
