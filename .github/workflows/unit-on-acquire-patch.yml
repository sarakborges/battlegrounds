name: unit-on-acquire-patch
on:
  push:
    branches: [unit-on-acquire-trigger]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unit-on-acquire-trigger
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply slice
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/Battlegrounds.Core/Domain/Effects/NativeEffectKeys.cs',
              '    public static NativeTriggerKey OnMatchStart { get; } = new("onMatchStart");\n    public static NativeTriggerKey OnPlay { get; } = new("onPlay");',
              '    public static NativeTriggerKey OnMatchStart { get; } = new("onMatchStart");\n    public static NativeTriggerKey OnAcquire { get; } = new("onAcquire");\n    public static NativeTriggerKey OnPlay { get; } = new("onPlay");')
          replace(
              'src/Battlegrounds.Core/Domain/Effects/NativeEffectKeys.cs',
              '        OnActivate, OnMatchStart, OnPlay, OnCombine, OnDeath, AfterFriendlyDeaths, AfterEventCount, OnSummon, OnAttack, OnDamage,',
              '        OnActivate, OnMatchStart, OnAcquire, OnPlay, OnCombine, OnDeath, AfterFriendlyDeaths, AfterEventCount, OnSummon, OnAttack, OnDamage,')

          replace(
              'src/Battlegrounds.Core/Domain/Preparation/PreparationEffectEngine.cs',
              '    public void ProcessPlayedUnit(\n',
              '''    public void ProcessAcquiredUnit(MatchState match, PlayerState owner, UnitInstance unit)\n    {\n        var (world, runtime) = GetRuntime(match);\n        var subject = world.Wrap(unit, owner.Id);\n        runtime.RecordGameEvent(owner.Id, NativeGameEventKeys.UnitAcquired, unit.Definition);\n        runtime.Process(new GameEffectEvent(NativeTriggerKeys.OnAcquire, subject));\n    }\n\n    public void ProcessPlayedUnit(\n''')

          replace(
              'src/Battlegrounds.Core/Domain/Preparation/PreparationEngine.cs',
              '''        var definition = player.TakeOfferedUnit(command.OfferSlot);\n        player.AddToReserve(match.CreateUnit(definition, UnitInstanceOrigin.Pooled));\n        player.SpendResource(_rules.AcquireCost);\n        _effectEngine.ProcessGameEvent(match, player, NativeGameEventKeys.UnitAcquired, definition);\n''',
              '''        var definition = player.TakeOfferedUnit(command.OfferSlot);\n        var unit = match.CreateUnit(definition, UnitInstanceOrigin.Pooled);\n        player.AddToReserve(unit);\n        player.SpendResource(_rules.AcquireCost);\n        _effectEngine.ProcessAcquiredUnit(match, player, unit);\n''')

          replace(
              'src/Battlegrounds.Content/GenerationChoiceModValidator.cs',
              '''        "onPlay",\n        "onTurnStart",''',
              '''        "onAcquire",\n        "onPlay",\n        "onTurnStart",''')
          replace(
              'src/Battlegrounds.Content/PersistentUnitMutationModValidator.cs',
              ': eventName is "onPlay" or "onTurnStart" or "onTurnEnd";',
              ': eventName is "onAcquire" or "onPlay" or "onTurnStart" or "onTurnEnd";')
          replace(
              'src/Battlegrounds.Content/ActionModValidator.cs',
              ': eventName is "onPlay" or "onTurnStart" or "onTurnEnd";',
              ': eventName is "onAcquire" or "onPlay" or "onTurnStart" or "onTurnEnd";')

          replace(
              'mods/warbands/content/units/goblin-tinkerer.json',
              '      "event": "onPlay",',
              '      "event": "onAcquire",')

          test_path = Path('tests/Battlegrounds.Core.Tests/Preparation/PreparationEffectExecutionTests.cs')
          test_text = test_path.read_text()
          marker = '    private static void AcquireById(\n'
          if marker not in test_text:
              raise SystemExit('test insertion marker missing')
          test = '''    [Fact]\n    public void Acquire_OnAcquireRunsAfterUnitEntersReserveAndPaymentIsApplied()\n    {\n        var acquired = new UnitDefinition(\n            new UnitId("acquired"),\n            "Acquired",\n            1,\n            1,\n            2,\n            triggers:\n            [\n                new TriggerDefinition(\n                    NativeTriggerKeys.OnAcquire,\n                    [\n                        new ModifyStatsEffectDefinition(new EffectTargetSelector(EffectTargetScope.Self), 2, 3),\n                        new AddResourceEffectDefinition(1),\n                    ]),\n            ]);\n\n        var setup = CreateStartedMatch([acquired], [acquired]);\n        var player = setup.Match.Players[0];\n\n        AcquireById(setup.Engine, setup.Match, player.Id, acquired.Id);\n\n        var unit = Assert.Single(player.Reserve);\n        Assert.Equal(acquired.Id, unit.Definition.Id);\n        Assert.Equal(3, unit.Attack);\n        Assert.Equal(5, unit.Health);\n        Assert.Equal(1, player.Resource);\n        Assert.Empty(player.Field);\n    }\n\n'''
          test_path.write_text(test_text.replace(marker, test + marker, 1))
      - name: Test core
        run: dotnet test tests/Battlegrounds.Core.Tests/Battlegrounds.Core.Tests.csproj --no-restore
      - name: Test content
        run: dotnet test tests/Battlegrounds.Content.Tests/Battlegrounds.Content.Tests.csproj --no-restore
      - name: Smoke Warbands
        run: dotnet run --project tools/Battlegrounds.Smoke/Battlegrounds.Smoke.csproj --no-restore -- mods/warbands
      - name: Commit implementation
        run: |
          rm .github/workflows/unit-on-acquire-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Unit onAcquire trigger" || exit 0
          git push origin HEAD:unit-on-acquire-trigger