name: Apply relative context targeting slice

on:
  push:
    branches:
      - relative-context-targeting

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relative-context-targeting
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply implementation
        run: |
          sed -i '425,479d' .github/relative-targeting-patch.py
          python3 .github/relative-targeting-patch.py
      - name: Test core and content
        run: |
          dotnet test tests/Battlegrounds.Core.Tests/Battlegrounds.Core.Tests.csproj
          dotnet test tests/Battlegrounds.Content.Tests/Battlegrounds.Content.Tests.csproj
      - name: Commit implementation
        run: |
          rm .github/relative-targeting-patch.py
          rm .github/workflows/relative-targeting-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement relative context targeting"
          git push origin relative-context-targeting
