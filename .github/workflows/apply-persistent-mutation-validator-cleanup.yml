name: Apply persistent mutation validator ownership cleanup

on:
  push:
    branches: [validator-persistent-mutation-ownership]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validator-persistent-mutation-ownership
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply validator ownership cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_before_once(path, marker, block):
              file = Path(path)
              text = file.read_text()
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"Expected one marker in {path}, found {count}")
              file.write_text(text.replace(marker, block + marker, 1))

          persistent_cases = '''            case "transformUnit":
            case "copyUnitToReserve":
            case "applyUnitModifier":
            case "removeUnitModifier":
                // Persistent mutation schemas are owned by PersistentUnitMutationModValidator.
                break;
'''

          generation_marker = '            case "generateUnitToReserve":\n'
          insert_before_once(
              'src/Battlegrounds.Content/DirectoryModValidator.cs',
              generation_marker,
              persistent_cases)
          insert_before_once(
              'src/Battlegrounds.Content/PowerLifecycleModValidator.cs',
              generation_marker,
              persistent_cases)

          action = Path('src/Battlegrounds.Content/ActionModValidator.cs')
          text = action.read_text()
          action_marker = '        "generateUnitToReserve", "generateUnitChoice", "generateActionToReserve", "generateActionChoice",\n'
          if text.count(action_marker) != 1:
              raise SystemExit('Could not locate ActionModValidator supported-effect insertion point')
          action_persistent = action_marker + '        "transformUnit", "copyUnitToReserve", "applyUnitModifier", "removeUnitModifier",\n'
          action.write_text(text.replace(action_marker, action_persistent, 1))

          mod_validator = Path('src/Battlegrounds.Content/ModValidator.cs')
          text = mod_validator.read_text()
          filter_line = '            .Where(issue => !IsSupersededPersistentMutationIssue(issue));\n'
          filter_count = text.count(filter_line)
          if filter_count != 6:
              raise SystemExit(f'Expected 6 persistent mutation filters, found {filter_count}')
          text = text.replace(filter_line, ';\n')

          base_filter = '        IsSupersededPersistentMutationIssue(issue) ||\n'
          if text.count(base_filter) != 1:
              raise SystemExit('Expected one persistent mutation base filter')
          text = text.replace(base_filter, '', 1)

          helper_marker = '\n    private static bool IsSupersededPersistentMutationIssue(ModValidationIssue issue)\n'
          start = text.find(helper_marker)
          if start < 0:
              raise SystemExit('Could not locate persistent mutation supersession helper')
          class_close = text.rfind('\n}\n')
          if class_close < start:
              raise SystemExit('Could not locate ModValidator class closing brace')
          text = text[:start] + text[class_close:]
          if 'IsSupersededPersistentMutationIssue' in text:
              raise SystemExit('Persistent mutation supersession helper still referenced after cleanup')
          mod_validator.write_text(text)

          tests = Path('tests/Battlegrounds.Content.Tests/PersistentUnitMutationValidationTests.cs')
          text = tests.read_text()
          marker = '''    [Fact]
    public void Validate_RejectsPersistentMutationFromCombatTrigger()
'''
          if text.count(marker) != 1:
              raise SystemExit('Could not locate persistent mutation validation test insertion point')
          coverage = '''    [Fact]
    public void Validate_AcceptsPersistentMutationAcrossPreparationSurfaces()
    {
        var path = CreateTempMod();
        try
        {
            File.WriteAllText(
                Path.Combine(path, "content", "actions", "mutation-lab.json"),
                """
                {
                  "id": "mutation-lab",
                  "name": "Mutation Lab",
                  "tier": 1,
                  "cost": 0,
                  "effects": [
                    {
                      "kind": "applyUnitModifier",
                      "target": { "scope": "selected" },
                      "modifierKey": "action-boost",
                      "attack": 1
                    },
                    {
                      "kind": "copyUnitToReserve",
                      "target": { "scope": "selected" }
                    },
                    {
                      "kind": "removeUnitModifier",
                      "target": { "scope": "selected" },
                      "modifierKey": "action-boost"
                    },
                    {
                      "kind": "transformUnit",
                      "target": { "scope": "selected" },
                      "unitId": "guard"
                    }
                  ]
                }
                """);

            WriteScout(
                path,
                """
                {
                  "event": "onPlay",
                  "effects": [
                    {
                      "kind": "applyUnitModifier",
                      "target": { "scope": "self" },
                      "modifierKey": "unit-boost",
                      "health": 1
                    },
                    {
                      "kind": "copyUnitToReserve",
                      "target": { "scope": "self" }
                    },
                    {
                      "kind": "removeUnitModifier",
                      "target": { "scope": "self" },
                      "modifierKey": "unit-boost"
                    },
                    {
                      "kind": "transformUnit",
                      "target": { "scope": "self" },
                      "unitId": "guard"
                    }
                  ]
                }
                """);

            File.WriteAllText(
                Path.Combine(path, "content", "powers", "quiet-aura.json"),
                """
                {
                  "id": "quiet-aura",
                  "name": "Quiet Aura",
                  "triggers": [
                    {
                      "event": "onTurnStart",
                      "effects": [
                        {
                          "kind": "applyUnitModifier",
                          "target": { "scope": "friendly", "selection": "leftmost", "limit": 1 },
                          "modifierKey": "power-boost",
                          "attack": 1
                        },
                        {
                          "kind": "copyUnitToReserve",
                          "target": { "scope": "friendly", "selection": "rightmost", "limit": 1 }
                        },
                        {
                          "kind": "removeUnitModifier",
                          "target": { "scope": "friendly", "selection": "all" },
                          "modifierKey": "power-boost"
                        },
                        {
                          "kind": "transformUnit",
                          "target": { "scope": "friendly", "selection": "lowestAttack", "limit": 1 },
                          "unitId": "guard"
                        }
                      ]
                    }
                  ]
                }
                """);

            var report = new ModValidator().Validate(path);

            Assert.True(
                report.IsValid,
                string.Join(Environment.NewLine, report.Issues.Select(issue => $"{issue.Code} {issue.File} {issue.Path}: {issue.Message}")));
        }
        finally
        {
            Directory.Delete(path, recursive: true);
        }
    }

'''
          tests.write_text(text.replace(marker, coverage + marker, 1))
          PY
      - name: Test content validation
        run: dotnet test tests/Battlegrounds.Content.Tests/Battlegrounds.Content.Tests.csproj --configuration Release
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-persistent-mutation-validator-cleanup.yml
          git add src/Battlegrounds.Content/DirectoryModValidator.cs \
                  src/Battlegrounds.Content/PowerLifecycleModValidator.cs \
                  src/Battlegrounds.Content/ActionModValidator.cs \
                  src/Battlegrounds.Content/ModValidator.cs \
                  tests/Battlegrounds.Content.Tests/PersistentUnitMutationValidationTests.cs
          git commit -m "Own persistent mutation validation without supersession"
          git push origin HEAD:validator-persistent-mutation-ownership
