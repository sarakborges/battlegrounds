name: Apply dynamic effect-value validator ownership cleanup

on:
  push:
    branches: [validator-dynamic-effect-value-ownership]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validator-dynamic-effect-value-ownership
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply validator ownership cleanup
        run: |
          echo '' | base64 --decode > /tmp/apply_dynamic_value_cleanup.py
          python3 /tmp/apply_dynamic_value_cleanup.py
      - name: Test content validation
        run: dotnet test tests/Battlegrounds.Content.Tests/Battlegrounds.Content.Tests.csproj --configuration Release
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dynamic-effect-value-validator-cleanup.yml
          git add src/Battlegrounds.Content/DirectoryModValidator.cs \
                  src/Battlegrounds.Content/PowerLifecycleModValidator.cs \
                  src/Battlegrounds.Content/ModValidator.cs \
                  tests/Battlegrounds.Content.Tests/DynamicEffectValueValidationTests.cs
          git commit -m "Own dynamic effect-value validation without supersession"
          git push origin HEAD:validator-dynamic-effect-value-ownership
