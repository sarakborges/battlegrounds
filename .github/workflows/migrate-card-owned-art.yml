name: Migrate card-owned art

on:
  push:
    branches: [fix/card-owned-art]
    paths:
      - .github/workflows/migrate-card-owned-art.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/card-owned-art
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply migration
        run: python scripts/migrate-card-owned-art.py

      - name: Test content contract
        run: dotnet test tests/Battlegrounds.Content.Tests/Battlegrounds.Content.Tests.csproj --configuration Release

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(content): make card art entity-owned"
          git push origin HEAD:fix/card-owned-art
