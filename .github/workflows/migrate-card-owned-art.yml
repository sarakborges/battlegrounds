name: Migrate card-owned art

on:
  push:
    branches: [fix/card-owned-art]
    paths:
      - .github/workflows/migrate-card-owned-art.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/card-owned-art
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Move card art metadata into card definitions
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import pathlib
          import re

          ROOT = pathlib.Path('.')

          UNITS = [
              'ancient-stag', 'bloodmane-raptor', 'bomb-lobber', 'bone-squire', 'bonecaller',
              'clockwork-brute', 'crypt-banshee', 'death-herald', 'dire-packlord', 'dread-guard',
              'elder-hydra', 'goblin-tinkerer', 'grave-champion', 'grave-ghoul', 'junkyard-foreman',
              'moonfang-alpha', 'pack-hunter', 'razorboar', 'restless-knight', 'scrap-titan',
              'scrapbot', 'shield-drone', 'siege-colossus', 'thornhide-bear', 'tomb-colossus',
              'war-machine', 'wolf-cub',
          ]
          ACTIONS = [
              'battle-plans', 'battle-training', 'heavy-armor', 'market-voucher', 'pack-bond',
              'sharpen-blades', 'tactical-retreat', 'veteran-drill', 'war-drums',
          ]

          def replace_once(path: str, old: str, new: str) -> None:
              file = ROOT / path
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence, found {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def write_json(path: pathlib.Path, payload: object) -> None:
              path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Mechanical validators permit presentation-only art metadata on card definitions.
          replace_once(
              'src/Battlegrounds.Content/ActionModValidator.cs',
              'ValidateKeys(file.Root, file.Path, "$", ["id", "name", "tier", "cost", "effects"], ["id", "name", "tier", "cost", "effects"], issues);',
              'ValidateKeys(file.Root, file.Path, "$", ["id", "name", "tier", "cost", "effects", "art"], ["id", "name", "tier", "cost", "effects"], issues);',
          )
          replace_once(
              'src/Battlegrounds.Content/DirectoryModValidator.cs',
              '["id", "name", "tier", "attack", "health", "behaviors", "types", "tags", "triggers", "auras"],',
              '["id", "name", "tier", "attack", "health", "behaviors", "types", "tags", "triggers", "auras", "art"],',
          )

          # The strict JSON data records consume art but do not pass it into Core definitions.
          replace_once(
              'src/Battlegrounds.Content/ModLoader.cs',
              'private sealed record ActionData(string Id, string Name, int Tier, int Cost, EffectData[] Effects);',
              'private sealed record ActionData(string Id, string Name, int Tier, int Cost, EffectData[] Effects, string? Art);',
          )
          replace_once(
              'src/Battlegrounds.Content/ModLoader.cs',
              'private sealed record UnitData(string Id, string Name, int Tier, int Attack, int Health, string[]? Behaviors, string[]? Types, string[]? Tags, TriggerData[]? Triggers, AuraData[]? Auras);',
              'private sealed record UnitData(string Id, string Name, int Tier, int Attack, int Health, string[]? Behaviors, string[]? Types, string[]? Tags, TriggerData[]? Triggers, AuraData[]? Auras, string? Art);',
          )

          # Validate unit/action art directly from their authored JSON files. The old manifest
          # no longer accepts card art, so there is one source of truth.
          validator_path = ROOT / 'src/Battlegrounds.Content/PresentationAssetModValidator.cs'
          validator = validator_path.read_text(encoding='utf-8')
          old = '''        var manifestPath = Path.Combine(modDirectory, "assets", "presentation.json");
                  if (!File.Exists(manifestPath)) return issues;
          '''
          new = '''        ValidateInlineCardArtDirectory(modDirectory, "content/units", issues);
                  ValidateInlineCardArtDirectory(modDirectory, "content/actions", issues);

                  var manifestPath = Path.Combine(modDirectory, "assets", "presentation.json");
                  if (!File.Exists(manifestPath)) return issues;
          '''
          if old not in validator:
              raise RuntimeError('PresentationAssetModValidator: manifest prelude not found')
          validator = validator.replace(old, new, 1)
          validator = validator.replace(
              'ValidateCategory(modDirectory, root, "units", "content/units", ModPresentationAssetSlots.Art, issues);',
              'ValidateCategory(modDirectory, root, "units", "content/units", null, issues);',
              1,
          )
          validator = validator.replace(
              'ValidateCategory(modDirectory, root, "actions", "content/actions", ModPresentationAssetSlots.Art, issues);',
              'ValidateCategory(modDirectory, root, "actions", "content/actions", null, issues);',
              1,
          )
          validator = validator.replace('        string expectedSlot,\n', '        string? expectedSlot,\n', 1)
          marker = '    private static void ValidateCategory(\n'
          inline_validator = r'''    private static void ValidateInlineCardArtDirectory(
              string modDirectory,
              string contentDirectory,
              ICollection<ModValidationIssue> issues)
          {
              var directory = Path.Combine(modDirectory, contentDirectory.Replace('/', Path.DirectorySeparatorChar));
              if (!Directory.Exists(directory)) return;

              foreach (var fullPath in Directory.GetFiles(directory, "*.json", SearchOption.TopDirectoryOnly)
                           .OrderBy(path => Path.GetFileName(path), StringComparer.Ordinal))
              {
                  var relativeFile = contentDirectory + "/" + Path.GetFileName(fullPath);
                  JsonElement root;
                  try
                  {
                      using var document = JsonDocument.Parse(File.ReadAllText(fullPath), DocumentOptions);
                      if (document.RootElement.ValueKind != JsonValueKind.Object) continue;
                      root = document.RootElement.Clone();
                  }
                  catch (JsonException)
                  {
                      continue;
                  }

                  if (!root.TryGetProperty(ModPresentationAssetSlots.Art, out var art)) continue;
                  ValidateInlineImagePath(modDirectory, relativeFile, art, "$.art", issues);
              }
          }

          private static void ValidateInlineImagePath(
              string modDirectory,
              string file,
              JsonElement value,
              string jsonPath,
              ICollection<ModValidationIssue> issues)
          {
              if (value.ValueKind != JsonValueKind.String || string.IsNullOrWhiteSpace(value.GetString()))
              {
                  issues.Add(new(
                      "INVALID_PRESENTATION_ASSET_PATH",
                      file,
                      jsonPath,
                      "Card art path must be a non-empty mod-relative string."));
                  return;
              }

              var relativePath = value.GetString()!;
              if (!TryResolveInsideMod(modDirectory, relativePath, out var fullPath))
              {
                  issues.Add(new(
                      "INVALID_PRESENTATION_ASSET_PATH",
                      file,
                      jsonPath,
                      $"Card art path '{relativePath}' must stay inside the mod and use a forward-slash relative path under assets/."));
                  return;
              }

              if (!ImageExtensions.Contains(Path.GetExtension(relativePath)))
              {
                  issues.Add(new(
                      "INVALID_PRESENTATION_ASSET_TYPE",
                      file,
                      jsonPath,
                      $"Card art '{relativePath}' must use one of: {string.Join(", ", ImageExtensions.OrderBy(item => item, StringComparer.Ordinal))}."));
                  return;
              }

              if (!File.Exists(fullPath))
              {
                  issues.Add(new(
                      "MISSING_PRESENTATION_ASSET",
                      file,
                      jsonPath,
                      $"Card art '{relativePath}' does not exist."));
              }
          }

          '''
          if marker not in validator:
              raise RuntimeError('PresentationAssetModValidator: category marker not found')
          validator = validator.replace(marker, inline_validator + marker, 1)
          validator_path.write_text(validator, encoding='utf-8')

          # Build the static card-art catalog from the card definitions themselves. Leader portrait
          # and cue metadata remain in the presentation manifest because they are not card fields.
          assets_path = ROOT / 'src/Battlegrounds.Content/ModPresentationAssets.cs'
          assets = assets_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    internal static ModPresentationAssetCatalog LoadValidated\(string modDirectory\)\n'
              r'    \{.*?\n    \}\n\n'
              r'    private static void ReadAssetCategory',
              re.S,
          )
          replacement = r'''    internal static ModPresentationAssetCatalog LoadValidated(string modDirectory)
              {
                  var entries = new List<ModPresentationAssetEntry>();
                  var manifestPath = Path.Combine(modDirectory, "assets", "presentation.json");
                  if (File.Exists(manifestPath))
                  {
                      using var document = JsonDocument.Parse(File.ReadAllText(manifestPath), DocumentOptions);
                      ReadAssetCategory(document.RootElement, "leaders", ModPresentationEntityKind.Leader, ModPresentationAssetSlots.Portrait, entries);
                  }

                  ReadInlineCardArt(modDirectory, "content/units", ModPresentationEntityKind.Unit, entries);
                  ReadInlineCardArt(modDirectory, "content/actions", ModPresentationEntityKind.Action, entries);
                  return new ModPresentationAssetCatalog(entries);
              }

              private static void ReadInlineCardArt(
                  string modDirectory,
                  string contentDirectory,
                  ModPresentationEntityKind kind,
                  ICollection<ModPresentationAssetEntry> entries)
              {
                  var directory = Path.Combine(modDirectory, contentDirectory.Replace('/', Path.DirectorySeparatorChar));
                  if (!Directory.Exists(directory)) return;

                  foreach (var path in Directory.GetFiles(directory, "*.json", SearchOption.TopDirectoryOnly)
                               .OrderBy(path => Path.GetFileName(path), StringComparer.Ordinal))
                  {
                      using var document = JsonDocument.Parse(File.ReadAllText(path), DocumentOptions);
                      var root = document.RootElement;
                      if (!root.TryGetProperty(ModPresentationAssetSlots.Art, out var artElement)) continue;

                      var entityId = root.TryGetProperty("id", out var idElement)
                          ? idElement.GetString()
                          : null;
                      entityId ??= Path.GetFileNameWithoutExtension(path);
                      var relativePath = artElement.GetString()
                          ?? throw new InvalidDataException($"Validated card art '{contentDirectory}/{entityId}.json' has no path.");
                      entries.Add(new ModPresentationAssetEntry(
                          kind,
                          entityId,
                          ModPresentationAssetSlots.Art,
                          new ModPresentationAssetReference(ModPresentationAssetType.Image, relativePath)));
                  }
              }

              private static void ReadAssetCategory'''
          assets, count = pattern.subn(replacement, assets, count=1)
          if count != 1:
              raise RuntimeError(f'ModPresentationAssets: expected one loader block, replaced {count}')
          assets_path.write_text(assets, encoding='utf-8')

          # Example mod follows the same card-owned contract while keeping cue/leader metadata in the manifest.
          for category, entity_id in [('units', 'scout'), ('actions', 'training')]:
              path = ROOT / 'mods' / 'example' / 'content' / category / f'{entity_id}.json'
              payload = json.loads(path.read_text(encoding='utf-8'))
              payload['art'] = f'assets/{category}/{entity_id}.svg'
              write_json(path, payload)

          example_manifest_path = ROOT / 'mods/example/assets/presentation.json'
          example_manifest = json.loads(example_manifest_path.read_text(encoding='utf-8'))
          for category, entity_id in [('units', 'scout'), ('actions', 'training')]:
              entity = example_manifest.get(category, {}).get(entity_id, {})
              entity.pop('art', None)
          write_json(example_manifest_path, example_manifest)

          # Warbands: every actual card owns its art path.
          for category, ids in [('units', UNITS), ('actions', ACTIONS)]:
              for entity_id in ids:
                  path = ROOT / 'mods' / 'warbands' / 'content' / category / f'{entity_id}.json'
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  payload['art'] = f'assets/{category}/{entity_id}.webp'
                  write_json(path, payload)

          for obsolete in [
              ROOT / 'mods/warbands/assets/presentation.json',
              ROOT / 'mods/warbands/assets/art-sources.json',
          ]:
              obsolete.unlink(missing_ok=True)

          # Importer now writes only the local art file and the card's own art field.
          importer = r'''#!/usr/bin/env python3
          from __future__ import annotations

          import json
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          CARDS_URL = "https://api.hearthstonejson.com/v1/latest/enUS/cards.json"
          ART_URL = "https://art.hearthstonejson.com/v1/512x/{card_id}.webp"
          MOD_ROOT = pathlib.Path("mods/warbands")
          ASSET_ROOT = MOD_ROOT / "assets"

          UNITS = {
              "wolf-cub": "Timber Wolf",
              "razorboar": "Razorboar",
              "pack-hunter": "Scavenging Hyena",
              "moonfang-alpha": "Moonfang",
              "thornhide-bear": "Witchwood Grizzly",
              "bloodmane-raptor": "Bloodfen Raptor",
              "ancient-stag": "Gloom Stag",
              "elder-hydra": "Cave Hydra",
              "dire-packlord": "Dire Wolf Alpha",
              "bone-squire": "Skeletal Sidekick",
              "grave-ghoul": "Unstable Ghoul",
              "restless-knight": "Risen Rider",
              "crypt-banshee": "Wailing Banshee",
              "bonecaller": "Bonecaller",
              "dread-guard": "Deathlord",
              "death-herald": "Deathspeaker",
              "tomb-colossus": "Flesh Behemoth",
              "grave-champion": "Skeletal Knight",
              "scrapbot": "Junkbot",
              "goblin-tinkerer": "Tinkertown Technician",
              "shield-drone": "Shielded Minibot",
              "bomb-lobber": "Bomb Lobber",
              "clockwork-brute": "Clockwork Knight",
              "junkyard-foreman": "Scrap Scraper",
              "war-machine": "Foe Reaper 4000",
              "siege-colossus": "Siege Engine",
              "scrap-titan": "Scrap Golem",
          }

          ACTIONS = {
              "battle-plans": "Secret Plan",
              "battle-training": "Training Session",
              "heavy-armor": "Heavy Plate",
              "market-voucher": "The Coin",
              "pack-bond": "Pack Tactics",
              "sharpen-blades": "Deadly Poison",
              "tactical-retreat": "Vanish",
              "veteran-drill": "Into the Fray",
              "war-drums": "Drum Circle",
          }

          PREFERRED_IDS = {
              "Timber Wolf": "DS1_175",
              "Razorboar": "BAR_325",
              "Scavenging Hyena": "EX1_531",
              "Moonfang": "YOP_035",
              "Witchwood Grizzly": "GIL_623",
              "Bloodfen Raptor": "CS2_172",
              "Dire Wolf Alpha": "EX1_162",
              "Risen Rider": "BG25_001",
              "Deathspeaker": "ICC_467",
              "The Coin": "GAME_005",
          }

          def fetch_bytes(url: str, timeout: int = 30) -> bytes:
              request = urllib.request.Request(url, headers={"User-Agent": "Battlegrounds-Warbands-Card-Art-Fetcher/1.2"})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read()

          def load_cards() -> list[dict]:
              payload = json.loads(fetch_bytes(CARDS_URL).decode("utf-8"))
              if not isinstance(payload, list):
                  raise ValueError("HearthstoneJSON cards endpoint did not return a list")
              return payload

          def score(card: dict, expected_type: str) -> tuple[int, int, int, int]:
              card_id = str(card.get("id", ""))
              is_triple = card_id.startswith("TB_BaconUps_") or card_id.endswith("_G") or "_GOLDEN" in card_id.upper()
              return (
                  1 if str(card.get("type", "")) == expected_type else 0,
                  1 if card.get("collectible") else 0,
                  0 if is_triple else 1,
                  int(card.get("dbfId", 0) or 0),
              )

          def find_cards(cards: list[dict], name: str, expected_type: str) -> list[dict]:
              matches = [card for card in cards if str(card.get("name", "")).casefold() == name.casefold()]
              if not matches:
                  raise LookupError(f"No Hearthstone card named {name!r}")
              matches.sort(key=lambda card: score(card, expected_type), reverse=True)
              preferred_id = PREFERRED_IDS.get(name)
              if preferred_id:
                  preferred = next((card for card in matches if card.get("id") == preferred_id), None)
                  if preferred is not None:
                      matches.remove(preferred)
                      matches.insert(0, preferred)
              return matches

          def download_art(candidates: list[dict], target: pathlib.Path) -> dict:
              failures: list[str] = []
              for card in candidates:
                  card_id = str(card["id"])
                  try:
                      data = fetch_bytes(ART_URL.format(card_id=card_id))
                  except urllib.error.HTTPError as exc:
                      failures.append(f"{card_id}:{exc.code}")
                      continue
                  if len(data) < 12 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                      failures.append(f"{card_id}:not-webp")
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  return card
              raise ValueError(f"No downloadable WebP art among candidates: {', '.join(failures)}")

          def update_card_definition(group: str, entity_id: str) -> None:
              path = MOD_ROOT / "content" / group / f"{entity_id}.json"
              payload = json.loads(path.read_text(encoding="utf-8"))
              payload["art"] = f"assets/{group}/{entity_id}.webp"
              path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          def import_group(cards: list[dict], mapping: dict[str, str], group: str, expected_type: str) -> None:
              for entity_id, source_name in mapping.items():
                  card = download_art(find_cards(cards, source_name, expected_type), ASSET_ROOT / group / f"{entity_id}.webp")
                  update_card_definition(group, entity_id)
                  print(f"{group.upper():7} {entity_id}: {source_name} -> {card.get('id')}")

          def validate_authored_ids() -> None:
              unit_ids = {path.stem for path in (MOD_ROOT / "content/units").glob("*.json")}
              action_ids = {path.stem for path in (MOD_ROOT / "content/actions").glob("*.json")}
              missing_units = sorted(set(UNITS) - unit_ids)
              missing_actions = sorted(set(ACTIONS) - action_ids)
              uncovered_units = sorted(unit_ids - set(UNITS))
              uncovered_actions = sorted(action_ids - set(ACTIONS))
              if missing_units or missing_actions or uncovered_units or uncovered_actions:
                  raise ValueError(
                      "Card art mapping is out of sync with authored content: "
                      f"missing_units={missing_units}, missing_actions={missing_actions}, "
                      f"uncovered_units={uncovered_units}, uncovered_actions={uncovered_actions}"
                  )

          def main() -> int:
              validate_authored_ids()
              cards = load_cards()
              import_group(cards, UNITS, "units", "MINION")
              import_group(cards, ACTIONS, "actions", "SPELL")
              (ASSET_ROOT / "presentation.json").unlink(missing_ok=True)
              (ASSET_ROOT / "art-sources.json").unlink(missing_ok=True)
              print(f"\nImported {len(UNITS)} unit arts and {len(ACTIONS)} action arts; card JSONs own their art paths.")
              return 0

          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except (urllib.error.URLError, urllib.error.HTTPError, OSError, ValueError, LookupError) as exc:
                  print(f"ERROR: {exc}", file=sys.stderr)
                  sys.exit(1)
          '''
          # Strip the indentation inherited from this migration heredoc.
          import textwrap
          (ROOT / 'scripts/fetch-warbands-card-art.py').write_text(textwrap.dedent(importer), encoding='utf-8')

          workflow = '''name: Fetch Warbands card art

          on:
            push:
              paths:
                - scripts/fetch-warbands-card-art.py
                - .github/workflows/fetch-warbands-card-art.yml

          permissions:
            contents: write

          jobs:
            fetch:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.ref_name }}
                    fetch-depth: 0

                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'

                - name: Fetch Hearthstone card art
                  run: python scripts/fetch-warbands-card-art.py

                - name: Commit imported art and card links
                  shell: bash
                  run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add -A mods/warbands/assets mods/warbands/content/units mods/warbands/content/actions
                    if git diff --cached --quiet; then
                      echo "No card art changes to commit."
                      exit 0
                    fi
                    git commit -m "feat(warbands): import Hearthstone card art"
                    git pull --rebase origin "${{ github.ref_name }}"
                    git push origin "HEAD:${{ github.ref_name }}"
          '''
          (ROOT / '.github/workflows/fetch-warbands-card-art.yml').write_text(textwrap.dedent(workflow), encoding='utf-8')

          # Update asset tests to exercise inline card art and reject legacy manifest card art.
          tests = r'''using System.Text.Json;
          using System.Text.Json.Nodes;
          using Battlegrounds.Content;

          namespace Battlegrounds.Content.Tests;

          public sealed class PresentationAssetTests
          {
              [Fact]
              public void Load_ExampleAssetsAreIndexedByStableEntityId()
              {
                  var path = Path.Combine(AppContext.BaseDirectory, "mods", "example");
                  var assets = new ModPresentationAssetLoader().Load(path);

                  var portrait = assets.GetRequired(ModPresentationEntityKind.Leader, "steady", ModPresentationAssetSlots.Portrait);
                  var unitArt = assets.GetRequired(ModPresentationEntityKind.Unit, "scout", ModPresentationAssetSlots.Art);
                  var actionArt = assets.GetRequired(ModPresentationEntityKind.Action, "training", ModPresentationAssetSlots.Art);
                  Assert.Equal("assets/leaders/steady.svg", portrait.RelativePath);
                  Assert.Equal("assets/units/scout.svg", unitArt.RelativePath);
                  Assert.Equal("assets/actions/training.svg", actionArt.RelativePath);
                  Assert.False(assets.TryGet(ModPresentationEntityKind.Unit, "guard", ModPresentationAssetSlots.Art, out _));
                  Assert.Throws<NotSupportedException>(() => ((IList<ModPresentationAssetEntry>)assets.All).Add(assets.All[0]));
              }

              [Fact]
              public void Load_ExampleCuesAreIndexedByEntityAndRole()
              {
                  var path = Path.Combine(AppContext.BaseDirectory, "mods", "example");
                  var cues = new ModPresentationCueLoader().Load(path);
                  var attack = cues.GetRequired(ModPresentationEntityKind.Unit, "scout", ModPresentationCueRoles.CombatAttack);
                  Assert.Equal(ModPresentationAnimation.Lunge, attack.Animation);
                  Assert.Equal(0.2, attack.DurationSeconds);
                  Assert.True(cues.TryGet(ModPresentationEntityKind.Leader, "steady", ModPresentationCueRoles.UiSelect, out _));
              }

              [Fact]
              public void Load_MissingAssetsAndCardArtProducesEmptyCatalogs()
              {
                  var path = CreateTempMod();
                  try
                  {
                      RemoveCardArt(path, "units", "scout");
                      RemoveCardArt(path, "actions", "training");
                      Directory.Delete(Path.Combine(path, "assets"), recursive: true);

                      var report = new ModValidator().Validate(path);
                      var assets = new ModPresentationAssetLoader().Load(path);
                      var cues = new ModPresentationCueLoader().Load(path);

                      Assert.True(report.IsValid);
                      Assert.Empty(assets.All);
                      Assert.Empty(cues.All);
                  }
                  finally { Directory.Delete(path, recursive: true); }
              }

              [Fact]
              public void Validate_LegacyManifestCardArtIsRejected()
              {
                  var path = CreateTempMod();
                  try
                  {
                      SetManifestAsset(path, "units", "scout", "art", "assets/units/scout.svg");
                      var report = new ModValidator().Validate(path);
                      Assert.Contains(report.Issues, issue =>
                          issue.Code == "UNKNOWN_PRESENTATION_ASSET_SLOT" && issue.Path == "$.units.scout.art");
                  }
                  finally { Directory.Delete(path, recursive: true); }
              }

              [Theory]
              [InlineData("assets/../content/units/scout.json", "INVALID_PRESENTATION_ASSET_PATH")]
              [InlineData("assets/units/missing.svg", "MISSING_PRESENTATION_ASSET")]
              public void Validate_InlineCardArtPathIsValidated(string art, string expectedCode)
              {
                  var path = CreateTempMod();
                  try
                  {
                      SetCardArt(path, "units", "scout", art);
                      var report = new ModValidator().Validate(path);
                      Assert.Contains(report.Issues, issue =>
                          issue.Code == expectedCode &&
                          issue.File == "content/units/scout.json" &&
                          issue.Path == "$.art");
                  }
                  finally { Directory.Delete(path, recursive: true); }
              }

              [Fact]
              public void Validate_InlineCardArtRejectsNonImageExtension()
              {
                  var path = CreateTempMod();
                  try
                  {
                      File.WriteAllText(Path.Combine(path, "assets", "units", "scout.txt"), "not an image");
                      SetCardArt(path, "units", "scout", "assets/units/scout.txt");
                      var report = new ModValidator().Validate(path);
                      Assert.Contains(report.Issues, issue => issue.Code == "INVALID_PRESENTATION_ASSET_TYPE" && issue.Path == "$.art");
                  }
                  finally { Directory.Delete(path, recursive: true); }
              }

              [Fact]
              public void Validate_CueRejectsUnknownRoleAndAnimation()
              {
                  var path = CreateTempMod();
                  try
                  {
                      SetCue(path, "units", "scout", "combat.teleport", new JsonObject
                      {
                          ["animation"] = "warp",
                          ["durationSeconds"] = 0.2,
                      });
                      var report = new ModValidator().Validate(path);
                      Assert.Contains(report.Issues, issue => issue.Code == "UNKNOWN_PRESENTATION_CUE_ROLE");
                      Assert.Contains(report.Issues, issue => issue.Code == "INVALID_PRESENTATION_CUE_ANIMATION");
                  }
                  finally { Directory.Delete(path, recursive: true); }
              }

              [Fact]
              public void Load_AudioCueExposesImmutableAudioReference()
              {
                  var path = CreateTempMod();
                  try
                  {
                      Directory.CreateDirectory(Path.Combine(path, "assets", "audio"));
                      File.WriteAllBytes(Path.Combine(path, "assets", "audio", "hit.wav"), [0x52, 0x49, 0x46, 0x46]);
                      SetCue(path, "units", "scout", ModPresentationCueRoles.CombatDamage, new JsonObject
                      {
                          ["animation"] = "shake",
                          ["durationSeconds"] = 0.15,
                          ["audio"] = "assets/audio/hit.wav",
                      });
                      var cue = new ModPresentationCueLoader().Load(path)
                          .GetRequired(ModPresentationEntityKind.Unit, "scout", ModPresentationCueRoles.CombatDamage);
                      Assert.Equal(ModPresentationAssetType.Audio, cue.Audio?.Type);
                      Assert.Equal("assets/audio/hit.wav", cue.Audio?.RelativePath);
                  }
                  finally { Directory.Delete(path, recursive: true); }
              }

              private static void SetCardArt(string modPath, string category, string entityId, string art)
              {
                  var path = Path.Combine(modPath, "content", category, entityId + ".json");
                  var root = JsonNode.Parse(File.ReadAllText(path))?.AsObject()
                      ?? throw new InvalidDataException("Card definition must contain an object.");
                  root["art"] = art;
                  File.WriteAllText(path, root.ToJsonString(new JsonSerializerOptions { WriteIndented = true }));
              }

              private static void RemoveCardArt(string modPath, string category, string entityId)
              {
                  var path = Path.Combine(modPath, "content", category, entityId + ".json");
                  var root = JsonNode.Parse(File.ReadAllText(path))?.AsObject()
                      ?? throw new InvalidDataException("Card definition must contain an object.");
                  root.Remove("art");
                  File.WriteAllText(path, root.ToJsonString(new JsonSerializerOptions { WriteIndented = true }));
              }

              private static void SetManifestAsset(string modPath, string category, string entityId, string slot, string assetPath)
              {
                  var manifestPath = Path.Combine(modPath, "assets", "presentation.json");
                  var root = JsonNode.Parse(File.ReadAllText(manifestPath))?.AsObject()
                      ?? throw new InvalidDataException("Test asset manifest must contain a JSON object.");
                  var categoryObject = root[category]?.AsObject() ?? new JsonObject();
                  root[category] = categoryObject;
                  var entityObject = categoryObject[entityId]?.AsObject() ?? new JsonObject();
                  categoryObject[entityId] = entityObject;
                  entityObject[slot] = assetPath;
                  File.WriteAllText(manifestPath, root.ToJsonString(new JsonSerializerOptions { WriteIndented = true }));
              }

              private static void SetCue(string modPath, string category, string entityId, string role, JsonObject cue)
              {
                  var manifestPath = Path.Combine(modPath, "assets", "presentation.json");
                  var root = JsonNode.Parse(File.ReadAllText(manifestPath))?.AsObject()
                      ?? throw new InvalidDataException("Test asset manifest must contain a JSON object.");
                  var categoryObject = root[category]?.AsObject() ?? new JsonObject();
                  root[category] = categoryObject;
                  var entityObject = categoryObject[entityId]?.AsObject() ?? new JsonObject();
                  categoryObject[entityId] = entityObject;
                  var cues = entityObject["cues"]?.AsObject() ?? new JsonObject();
                  entityObject["cues"] = cues;
                  cues[role] = cue;
                  File.WriteAllText(manifestPath, root.ToJsonString(new JsonSerializerOptions { WriteIndented = true }));
              }

              private static string CreateTempMod()
              {
                  var source = Path.Combine(AppContext.BaseDirectory, "mods", "example");
                  var target = Path.Combine(Path.GetTempPath(), "battlegrounds-presentation-assets", Guid.NewGuid().ToString("N"));
                  CopyDirectory(source, target);
                  return target;
              }

              private static void CopyDirectory(string source, string target)
              {
                  Directory.CreateDirectory(target);
                  foreach (var directory in Directory.GetDirectories(source, "*", SearchOption.AllDirectories))
                      Directory.CreateDirectory(directory.Replace(source, target, StringComparison.Ordinal));
                  foreach (var file in Directory.GetFiles(source, "*", SearchOption.AllDirectories))
                      File.Copy(file, file.Replace(source, target, StringComparison.Ordinal));
              }
          }
