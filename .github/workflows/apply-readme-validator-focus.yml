name: Apply README validator focus update

on:
  push:
    branches: [docs/advance-validator-focus]

permissions:
  contents: write

jobs:
  update-readme:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/advance-validator-focus
      - name: Advance README validator focus
        run: |
          echo '' | base64 --decode > /tmp/update_readme.py
          python3 /tmp/update_readme.py
      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Advance validator cleanup focus"
          git push origin HEAD:docs/advance-validator-focus
