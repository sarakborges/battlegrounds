name: Run current boundary docs refresh

on:
  push:
    branches:
      - docs-current-boundaries
    paths:
      - .github/workflows/refresh-current-boundaries-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh current boundaries
        shell: python
        run: |
          from pathlib import Path

          game = Path('GAME.md')
          text = game.read_text()
          before = "- `ParticipantCount`: one human plus AI opponents. It must satisfy the selected mod's player-count rules and is currently required to be even because round one has no eliminated-opponent snapshot;"
          after = "- `ParticipantCount`: one human plus AI opponents. It may be odd or even and must satisfy the selected mod's player-count rules; an odd first combat round uses an explicit bye until an eliminated-opponent snapshot exists;"
          if before not in text:
              raise SystemExit('stale participant wording not found')
          text = text.replace(before, after, 1)
          before = '''## Next presentation boundary\n\nThe development scene still receives one exported `ModPath`, so a real user cannot inspect/select mods without changing editor configuration. The next boundary should introduce deterministic mod discovery and a Godot selection surface over lightweight Content-owned package summaries/validation diagnostics. Invalid packages should remain inspectable but must never become running sessions, and Application/Core must remain unaware of discovery directories or selection UI.\n'''
          after = '''## Mod selection boundary\n\nThe project starts from `ModLauncher`, which asks `Battlegrounds.Content` for deterministic package discovery and lightweight validation summaries before a gameplay session exists. Valid packages may be selected and launched; invalid packages remain inspectable through diagnostics but never become running sessions.\n\nDiscovery directories, package inspection and selection UI remain presentation/content concerns. `Battlegrounds.Application` and `Battlegrounds.Core` only receive an already validated selected package and stay unaware of launcher filesystem policy.\n'''
          if before not in text:
              raise SystemExit('stale launcher boundary not found')
          game.write_text(text.replace(before, after, 1))

          app = Path('APPLICATION.md')
          text = app.read_text()
          before = '''## Current odd-player constraint\n\nThe current Core combat contract requires an eliminated-opponent snapshot when the active player count is odd. No such snapshot exists before the first combat round, so a session currently requires an even initial participant count.\n\nThis is an explicit application precondition, not a hidden bye rule. A future matchmaking design may change that contract, but the session must continue to produce explicit pairings rather than bypass `MatchEngine` validation.\n'''
          after = '''## Odd-player pairing boundary\n\nSessions may start with odd or even participant counts as long as the selected mod's player-count rules allow them. Pairing remains explicit: when an odd active-player count has no eliminated-opponent snapshot yet, the pairing policy assigns one explicit bye. A bye is recorded in authoritative pairing history, creates no combat settlement, deals no damage and fires no combat lifecycle effects.\n\nOnce an eliminated-opponent snapshot exists, the odd player may instead be paired against that immutable archived participant. `SinglePlayerSession` still delegates pairing policy and submits the resulting explicit `CombatPairing` values to `MatchEngine`; it never bypasses Core pairing validation.\n'''
          if before not in text:
              raise SystemExit('stale odd-player boundary not found')
          app.write_text(text.replace(before, after, 1))
      - name: Commit docs directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GAME.md APPLICATION.md
          git commit -m "Refresh current application boundaries"
          git push origin HEAD:main
