name: Apply combat summon tier fix

on:
  push:
    branches: [combat-summon-tier-settlement]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: combat-summon-tier-settlement
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Preserve authored survivor tiers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Battlegrounds.Core/Domain/Combat/CombatEngine.cs')
          text = path.read_text()
          old = '_units.Select(unit => new CombatSurvivor(unit.InstanceId, unit.Health)).ToArray();'
          new = '_units.Select(unit => new CombatSurvivor(unit.InstanceId, unit.Health, unit.Definition.Tier)).ToArray();'
          if text.count(old) != 1:
              raise SystemExit(f'expected one survivor mapping, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Test core
        run: dotnet test tests/Battlegrounds.Core.Tests/Battlegrounds.Core.Tests.csproj --configuration Release
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/combat-summon-tier-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve authored tiers for combat summons'
          git push origin HEAD:combat-summon-tier-settlement
