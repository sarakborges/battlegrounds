name: Apply generation validator ownership cleanup

on:
  push:
    branches: [validator-generation-ownership]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validator-generation-ownership
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply validator ownership cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          generation_cases = '''            case "generateUnitToReserve":
            case "generateUnitChoice":
            case "generateActionToReserve":
            case "generateActionChoice":
                // Generation schemas are owned by GenerationChoiceModValidator and ActionModValidator.
                break;
'''

          directory_default = '''            default:
                ValidateKeys(effect, file, path, ["kind"], ["kind"], issues);
                issues.Add(new("UNSUPPORTED_EFFECT", file, path + ".kind", $"Effect kind '{kind}' is not supported."));
                break;
'''
          replace_once(
              'src/Battlegrounds.Content/DirectoryModValidator.cs',
              directory_default,
              generation_cases + directory_default)

          power_default = '''            default:
                issues.Add(new("UNSUPPORTED_EFFECT", file, path + ".kind", $"Effect kind '{kind}' is not supported."));
                break;
'''
          replace_once(
              'src/Battlegrounds.Content/PowerLifecycleModValidator.cs',
              power_default,
              generation_cases + power_default)

          mod_validator = Path('src/Battlegrounds.Content/ModValidator.cs')
          text = mod_validator.read_text()
          direct_filter = '            .Where(issue => !IsSupersededGenerationIssue(issue))\n'
          if text.count(direct_filter) != 1:
              raise SystemExit('Expected exactly one direct generation supersession filter')
          text = text.replace(direct_filter, '', 1)
          base_filter = '        IsSupersededGenerationIssue(issue) ||\n'
          if text.count(base_filter) != 1:
              raise SystemExit('Expected exactly one base generation supersession filter')
          text = text.replace(base_filter, '', 1)
          start = text.find('    private static bool IsSupersededGenerationIssue(')
          end = text.find('    private static bool IsSupersededPersistentMutationIssue(', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate generation supersession helper')
          text = text[:start] + text[end:]
          mod_validator.write_text(text)

          tests = Path('tests/Battlegrounds.Content.Tests/GenerationChoiceValidationTests.cs')
          text = tests.read_text()
          marker = '''    [Fact]
    public void Validate_RejectsGenerationFromCombatTrigger()
'''
          if text.count(marker) != 1:
              raise SystemExit('Could not locate generation validation test insertion point')
          coverage = '''    [Fact]
    public void Validate_AcceptsUnitAndActionGenerationAcrossPreparationTriggers()
    {
        var path = CreateTempMod();
        try
        {
            var generationEffects = """
                { "kind": "generateUnitToReserve", "unitId": "guard", "count": 2 },
                {
                  "kind": "generateUnitChoice",
                  "generationQuery": {
                    "minimumTier": 1,
                    "maximumTier": 2,
                    "typeId": "construct",
                    "tagId": "starter",
                    "excludeSource": true
                  },
                  "optionCount": 3
                },
                { "kind": "generateActionToReserve", "actionId": "training", "count": 1 },
                {
                  "kind": "generateActionChoice",
                  "actionQuery": {
                    "minimumTier": 1,
                    "maximumTier": 2,
                    "excludeActionId": "mutation-lab"
                  },
                  "optionCount": 2
                }
                """;

            WriteScout(
                path,
                $$"""
                {
                  "event": "onPlay",
                  "effects": [
                    {{generationEffects}}
                  ]
                }
                """);

            File.WriteAllText(
                Path.Combine(path, "content", "powers", "quiet-aura.json"),
                $$"""
                {
                  "id": "quiet-aura",
                  "name": "Quiet Aura",
                  "triggers": [
                    {
                      "event": "onTurnStart",
                      "effects": [
                        {{generationEffects}}
                      ]
                    }
                  ]
                }
                """);

            var report = new ModValidator().Validate(path);

            Assert.True(
                report.IsValid,
                string.Join(Environment.NewLine, report.Issues.Select(issue => $"{issue.Code} {issue.File} {issue.Path}: {issue.Message}")));
        }
        finally
        {
            Directory.Delete(path, recursive: true);
        }
    }

'''
          tests.write_text(text.replace(marker, coverage + marker, 1))

          if 'IsSupersededGenerationIssue' in mod_validator.read_text():
              raise SystemExit('Generation supersession helper still exists after cleanup')
          PY
      - name: Test content validation
        run: dotnet test tests/Battlegrounds.Content.Tests/Battlegrounds.Content.Tests.csproj --configuration Release
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Battlegrounds.Content/DirectoryModValidator.cs \
                  src/Battlegrounds.Content/PowerLifecycleModValidator.cs \
                  src/Battlegrounds.Content/ModValidator.cs \
                  tests/Battlegrounds.Content.Tests/GenerationChoiceValidationTests.cs
          git commit -m "Own generation validation without supersession"
          git push origin HEAD:validator-generation-ownership
